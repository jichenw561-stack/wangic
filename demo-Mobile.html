<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AI RIS · 智能研究助手演示</title>
<style>
/* ─── CSS Variables · White + Huatai Blue ─── */
:root {
  --bg:         #f5f7fa;
  --bg2:        #ffffff;
  --bg3:        #f0f3f8;
  --border:     #e2e7f0;
  --border2:    #d0d8e8;

  --ht-blue:    #0052cc;
  --ht-blue2:   #1a6fe8;
  --ht-blue-lt: #e8f0fc;
  --ht-blue-md: #c5d8f8;

  --green:      #0ea86a;
  --green-lt:   #e6f7f0;
  --red:        #e53935;
  --red-lt:     #fdecea;
  --orange:     #f57c00;
  --orange-lt:  #fff3e0;
  --yellow:     #f5a623;
  --purple:     #7c3aed;
  --teal:       #0891b2;

  --text1:      #1a2340;
  --text2:      #4a5875;
  --text3:      #8e9bb8;
  --text4:      #bcc5d8;

  --radius:     8px;
  --radius-lg:  14px;
  --shadow-sm:  0 1px 4px rgba(0,40,120,.08);
  --shadow-md:  0 4px 16px rgba(0,40,120,.12);
  --shadow-lg:  0 12px 40px rgba(0,40,120,.15);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "PingFang SC", "SF Pro Text", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text1);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 16px 48px;
}

/* ─── Page Header ─── */
.page-header {
  width: 100%; max-width: 420px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2px 14px;
  border-bottom: 2px solid var(--border);
  margin-bottom: 16px;
}
.ph-logo { display: flex; align-items: center; gap: 10px; }
.ph-logo-mark {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, var(--ht-blue), var(--ht-blue2));
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; color: #fff; letter-spacing: -0.5px;
  box-shadow: 0 3px 8px rgba(0,82,204,.3);
}
.ph-title { font-size: 17px; font-weight: 800; color: var(--ht-blue); letter-spacing: 0.5px; }
.ph-sub   { font-size: 10px; color: var(--text3); margin-top: 1px; }
.ph-badge {
  background: var(--ht-blue-lt); color: var(--ht-blue);
  font-size: 10px; font-weight: 700; padding: 3px 8px;
  border-radius: 6px; border: 1px solid var(--ht-blue-md); letter-spacing: 0.3px;
}

/* ─── Scenario Tabs ─── */
.scenario-tabs {
  width: 100%; max-width: 420px;
  display: flex; gap: 7px; margin-bottom: 12px;
}
.stab {
  flex: 1; padding: 9px 4px 8px;
  border-radius: 12px; border: 1.5px solid var(--border);
  background: var(--bg2); cursor: pointer; text-align: center;
  transition: all .2s; box-shadow: var(--shadow-sm);
}
.stab-icon { font-size: 17px; margin-bottom: 3px; }
.stab-label { font-size: 10px; color: var(--text3); line-height: 1.3; font-weight: 500; }
.stab.active { box-shadow: 0 3px 12px rgba(0,82,204,.18); }
.stab.active[data-s="1"] { border-color: var(--ht-blue); background: var(--ht-blue-lt); }
.stab.active[data-s="2"] { border-color: var(--green);   background: var(--green-lt); }
.stab.active[data-s="3"] { border-color: var(--orange);  background: var(--orange-lt); }
.stab.active[data-s="1"] .stab-label { color: var(--ht-blue); font-weight: 700; }
.stab.active[data-s="2"] .stab-label { color: var(--green);   font-weight: 700; }
.stab.active[data-s="3"] .stab-label { color: var(--orange);  font-weight: 700; }

/* ─── Scene Label ─── */
.scene-label {
  display: flex; align-items: center; gap: 6px;
  background: var(--ht-blue-lt); border: 1.5px solid var(--ht-blue-md);
  border-radius: 9px; padding: 6px 12px;
  font-size: 11px; font-weight: 600; color: var(--ht-blue);
  margin-bottom: 10px; width: 100%; max-width: 420px;
}
.scene-label[data-s="2"] { background: var(--green-lt);  border-color: #9de0c4; color: var(--green); }
.scene-label[data-s="3"] { background: var(--orange-lt); border-color: #ffc97a; color: var(--orange); }

/* ─── Phone Shell ─── */
.phone-shell {
  width: 100%; max-width: 420px;
  background: #111214; border: 1.5px solid #2a2d35;
  border-radius: 28px; overflow: hidden; box-shadow: 0 16px 48px rgba(0,0,0,.55);
  position: relative;
}

.status-bar {
  background: #1a1c22; padding: 7px 20px 6px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 10px; color: rgba(255,255,255,.6);
}
.sb-time { font-weight: 700; font-size: 11px; color: #fff; }
.sb-icons { display: flex; gap: 5px; }

.chat-header {
  background: #1a1c22; padding: 10px 16px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid #2a2d35;
  box-shadow: 0 1px 8px rgba(0,0,0,.3);
}
.ch-back { font-size: 20px; color: #e0e0e0; cursor: pointer; padding: 0 2px; }
.ch-avatar-wrap { position: relative; }
.ch-avatar {
  width: 38px; height: 38px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800; color: #fff; flex-shrink: 0;
}
.ch-avatar.single  { background: linear-gradient(135deg, var(--ht-blue), var(--ht-blue2)); }
.ch-avatar.my-bot  { background: linear-gradient(135deg, var(--green), #059669); }
.ch-avatar.group   { background: linear-gradient(135deg, var(--orange), #e65100); }
.ch-online {
  position: absolute; bottom: -1px; right: -1px;
  width: 10px; height: 10px; border-radius: 50%;
  background: #4cd964; border: 2px solid #1a1c22;
}
.ch-info { flex: 1; min-width: 0; }
.ch-name   { font-size: 14px; font-weight: 700; color: #f0f0f0; }
.ch-status { font-size: 10px; color: #4cd964; font-weight: 500; }
.ch-actions { display: flex; gap: 14px; color: #888; font-size: 17px; }

/* ─── Robot Info Panel ─── */
.robot-btn {
  background: none; border: none; cursor: pointer;
  color: #aaa; padding: 4px; display: flex; align-items: center;
  border-radius: 6px; transition: color .2s, background .2s;
}
.robot-btn:hover { color: #6ea8fe; background: rgba(110,168,254,.1); }

.robot-panel-overlay {
  position: absolute; inset: 0; z-index: 50;
  background: rgba(0,0,0,.5);
  display: none; align-items: flex-end;
}
.robot-panel-overlay.open { display: flex; }

.robot-panel {
  width: 100%; background: #1e2028;
  border-radius: 20px 20px 0 0;
  padding: 20px 20px 28px;
  animation: slideUp .25s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.rp-handle {
  width: 36px; height: 4px; background: #444; border-radius: 2px;
  margin: 0 auto 18px;
}
.rp-header {
  display: flex; align-items: center; gap: 14px; margin-bottom: 18px;
  padding-bottom: 16px; border-bottom: 1px solid #2a2d35;
}
.rp-avatar {
  width: 56px; height: 56px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; color: #fff; font-size: 22px; font-weight: 800;
}
.rp-avatar.single { background: linear-gradient(135deg, var(--ht-blue), var(--ht-blue2)); }
.rp-avatar.my-bot { background: linear-gradient(135deg, var(--green), #059669); }
.rp-avatar.group  { background: linear-gradient(135deg, var(--orange), #e65100); }
.rp-name { font-size: 17px; font-weight: 700; color: #f0f0f0; margin-bottom: 4px; }
.rp-tag {
  display: inline-block; font-size: 10px; font-weight: 600;
  background: rgba(110,168,254,.12); color: #6ea8fe;
  border: 1px solid rgba(110,168,254,.25); border-radius: 5px;
  padding: 2px 8px;
}
.rp-rows { display: flex; flex-direction: column; gap: 0; }
.rp-row {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 11px 0; border-bottom: 1px solid #2a2d35; font-size: 12.5px;
}
.rp-row:last-child { border-bottom: none; }
.rp-label { color: #666; font-weight: 500; flex-shrink: 0; margin-right: 12px; }
.rp-val { color: #ccc; font-weight: 500; text-align: right; line-height: 1.5; }
.rp-val.green { color: #4cd964; }
.rp-close {
  margin-top: 18px; width: 100%; padding: 12px;
  background: #2d2f38; border: none; border-radius: 12px;
  color: #aaa; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: background .2s;
}
.rp-close:hover { background: #35383f; }

/* ─── Chat Body ─── */
.chat-body {
  height: 480px; overflow-y: auto;
  padding: 14px 12px 6px;
  display: flex; flex-direction: column; gap: 0;
  scroll-behavior: smooth; background: #111214;
}
.chat-body::-webkit-scrollbar { width: 3px; }
.chat-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.date-divider {
  text-align: center; font-size: 10px; color: #555;
  padding: 4px 0 12px; font-weight: 500;
}

.msg-row {
  display: flex; align-items: flex-end; gap: 8px;
  margin-bottom: 10px;
  opacity: 0; transform: translateY(8px);
  transition: opacity .3s, transform .3s;
}
.msg-row.visible { opacity: 1; transform: translateY(0); }
.msg-row.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 34px; height: 34px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 800; flex-shrink: 0;
  align-self: flex-start; color: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.av-ryan   { background: linear-gradient(135deg, var(--ht-blue), var(--ht-blue2)); }
.av-aria   { background: linear-gradient(135deg, var(--green), #059669); }
.av-aaron  { background: linear-gradient(135deg, var(--orange), #e65100); }
.av-daniel { background: linear-gradient(135deg, var(--teal), #0369a1); }
.av-victor { background: linear-gradient(135deg, var(--purple), #5b21b6); }
.av-kevin  { background: linear-gradient(135deg, #0891b2, #0e7490); }
.av-jason  { background: linear-gradient(135deg, #059669, #047857); }
.av-user   { background: linear-gradient(135deg, #64748b, #475569); }

.msg-col { display: flex; flex-direction: column; max-width: 78%; gap: 3px; }
.msg-row.user .msg-col { align-items: flex-end; }

.msg-sender { font-size: 10px; color: #888; padding: 0 4px; font-weight: 600; }

.bubble {
  padding: 9px 13px; border-radius: 16px;
  font-size: 12.5px; line-height: 1.6; word-break: break-word;
}
.bubble.user-bubble {
  background: #1a4ba8; border-bottom-right-radius: 4px;
  color: #fff; box-shadow: 0 2px 8px rgba(0,40,140,.35);
}
.bubble.bot-bubble {
  background: #2d2f38; border-bottom-left-radius: 4px;
  border: none; color: #e8e8e8; box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.bubble.typing-bubble {
  background: #2d2f38; border: none;
  border-bottom-left-radius: 4px; padding: 11px 14px; box-shadow: 0 2px 6px rgba(0,0,0,.2);
}

.typing-dots { display: flex; gap: 4px; align-items: center; height: 14px; }
.typing-dots span {
  width: 5px; height: 5px; border-radius: 50%;
  background: #888; animation: tdot 1.2s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: .2s; }
.typing-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes tdot { 0%,80%,100%{transform:scale(.8);opacity:.4} 40%{transform:scale(1.1);opacity:1} }

/* Cards */
.bubble-card {
  background: #24262e; border: 1px solid #35383f;
  border-radius: 12px; padding: 10px 13px; margin-top: 5px; box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.bc-title {
  font-size: 11px; font-weight: 700; color: #6ea8fe;
  margin-bottom: 7px; display: flex; align-items: center; gap: 5px;
  padding-bottom: 6px; border-bottom: 1px solid #35383f;
}
.bc-row {
  display: flex; justify-content: space-between;
  padding: 5px 0; border-bottom: 1px solid #2a2c34; font-size: 11px;
}
.bc-row:last-child { border-bottom: none; }
.bc-label { color: #888; font-weight: 500; }
.bc-val   { color: #e0e0e0; font-weight: 600; }
.bc-val.red    { color: #ff6b6b; }
.bc-val.green  { color: #4cd964; }
.bc-val.orange { color: #ff9f43; }

.flow-card {
  background: #24262e; border: 1px solid #35383f;
  border-radius: 12px; padding: 10px 13px; margin-top: 5px; box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.fc-title { font-size: 11px; color: #888; margin-bottom: 8px; font-weight: 600; }
.fc-step { display: flex; align-items: center; gap: 9px; padding: 5px 0; font-size: 11.5px; color: #ccc; }
.fc-step-icon {
  width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; flex-shrink: 0;
}
.fc-step-icon.done    { background: rgba(76,217,100,.15); color: #4cd964; }
.fc-step-icon.running { background: rgba(100,160,255,.15); color: #6ea8fe; animation: pulse 1.5s infinite; }
.fc-step-icon.pending { background: #2a2c34; border: 1px solid #40434e; color: #555; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }

.table-bubble {
  overflow-x: auto; margin-top: 5px; border-radius: 10px;
  border: 1px solid #35383f; background: #24262e; box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.table-bubble table { width: 100%; border-collapse: collapse; min-width: 290px; }
.table-bubble th {
  background: #1a3a7a; color: rgba(255,255,255,.9);
  padding: 7px 9px; text-align: left; font-size: 10px; font-weight: 700; white-space: nowrap;
}
.table-bubble td {
  padding: 6px 9px; border-top: 1px solid #2a2c34;
  font-size: 11px; color: #b0b0b0; white-space: nowrap;
}
.table-bubble tr:hover td { background: #2d2f3a; }
td.pos { color: #4cd964; font-weight: 600; }
td.neg { color: #ff6b6b;  font-weight: 600; }
td.hl  { color: #e8e8e8; font-weight: 700; }

.skill-card {
  background: #24262e; border: 1px solid #2a4a8a;
  border-radius: 12px; padding: 12px 13px; margin-top: 5px;
  box-shadow: 0 2px 10px rgba(0,0,0,.3);
}
.skill-header { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.skill-icon-wrap {
  width: 38px; height: 38px; border-radius: 10px;
  background: rgba(110,168,254,.12); display: flex; align-items: center;
  justify-content: center; font-size: 19px; flex-shrink: 0;
}
.skill-name { font-size: 13px; font-weight: 700; color: #e8e8e8; }
.skill-ver  { font-size: 10px; color: #666; margin-top: 1px; }
.skill-desc { font-size: 11.5px; color: #aaa; line-height: 1.55; margin-bottom: 9px; }
.skill-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 9px; }
.skill-tag {
  background: rgba(110,168,254,.1); color: #6ea8fe;
  font-size: 10px; padding: 2px 8px; border-radius: 10px;
  font-weight: 600; border: 1px solid rgba(110,168,254,.25);
}
.skill-btn {
  width: 100%; padding: 8px; border-radius: 8px; border: none;
  background: #1a4ba8; color: #fff; font-size: 12px;
  font-weight: 700; cursor: pointer; transition: background .2s; letter-spacing: 0.3px;
}
.skill-btn:hover { background: #2558c4; }
.skill-btn.installed { background: rgba(76,217,100,.12); color: #4cd964; border: 1.5px solid rgba(76,217,100,.3); }

.cron-card {
  background: #201e14; border: 1px solid #4a3c00;
  border-radius: 12px; padding: 11px 13px; margin-top: 5px;
}
.cron-title { font-size: 11px; font-weight: 700; color: #ff9f43; display: flex; align-items: center; gap: 5px; margin-bottom: 7px; }
.cron-row { display: flex; align-items: center; gap: 7px; font-size: 11px; color: #aaa; padding: 3px 0; }
.cron-dot { width: 5px; height: 5px; border-radius: 50%; background: #4cd964; flex-shrink: 0; }

.task-card {
  background: #24262e; border: 1px solid #4a3c00;
  border-radius: 12px; padding: 11px 13px; margin-top: 5px; box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.task-title { font-size: 11px; font-weight: 700; color: #ff9f43; display: flex; align-items: center; gap: 5px; margin-bottom: 8px; }
.task-agent {
  display: flex; align-items: center; gap: 9px;
  padding: 6px 0; border-bottom: 1px solid #2a2c34; font-size: 11px;
}
.task-agent:last-child { border-bottom: none; }
.ta-av {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 800; color: #fff; flex-shrink: 0;
}
.ta-name   { flex: 1; color: #ccc; font-weight: 600; }
.ta-task   { font-size: 10px; color: #777; margin-top: 1px; font-weight: 400; }
.ta-status { font-size: 10px; font-weight: 700; }
.ta-status.running { color: #6ea8fe; }
.ta-status.done    { color: #4cd964; }
.ta-status.waiting { color: #555; }

.mention { color: #6ea8fe; font-weight: 700; }

.expert-pill {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(110,168,254,.1); color: #6ea8fe;
  font-size: 10px; font-weight: 700; padding: 2px 8px;
  border-radius: 10px; border: 1px solid rgba(110,168,254,.25);
  margin: 2px 2px 2px 0;
}

/* ─── Input (WeChat dark style) ─── */
.chat-input-area {
  background: #1a1c22; border-top: 1px solid #2a2d35;
  padding: 8px 10px 10px; display: flex; align-items: center; gap: 6px;
}
.cia-voice {
  width: 34px; height: 34px; border-radius: 50%; border: none;
  background: transparent; color: #aaa; font-size: 20px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: color .2s;
}
.cia-voice:hover { color: #fff; }
.cia-input {
  flex: 1; background: #2d2f38; border: 1px solid #3a3d48;
  border-radius: 20px; padding: 8px 14px; font-size: 13px; color: #e8e8e8;
  outline: none; resize: none; line-height: 1.4; max-height: 80px;
  overflow-y: auto; font-family: inherit; transition: border-color .2s;
}
.cia-input::placeholder { color: #555; }
.cia-input:focus { border-color: #4a6fa8; }
.cia-emoji {
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: transparent; color: #aaa; font-size: 20px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: color .2s;
}
.cia-emoji:hover { color: #fff; }
.cia-plus {
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: transparent; color: #aaa; font-size: 22px; font-weight: 300;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: color .2s; line-height: 1;
}
.cia-plus:hover { color: #fff; }

/* ─── Control Panel ─── */
.control-panel {
  width: 100%; max-width: 420px; margin-top: 14px;
  background: var(--bg2); border: 1.5px solid var(--border);
  border-radius: var(--radius-lg); padding: 13px 14px; box-shadow: var(--shadow-sm);
}
.cp-title { font-size: 10px; color: var(--text3); font-weight: 700; letter-spacing: 0.8px; margin-bottom: 10px; text-transform: uppercase; }
.cp-row { display: flex; gap: 8px; }
.cp-btn {
  flex: 1; padding: 9px 6px; border-radius: 10px;
  border: 1.5px solid var(--border); background: var(--bg3); color: var(--text2);
  font-size: 11px; font-weight: 700; cursor: pointer; text-align: center;
  transition: all .2s; display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.cp-btn span:first-child { font-size: 17px; }
.cp-btn:hover { border-color: var(--ht-blue); color: var(--ht-blue); background: var(--ht-blue-lt); }
.cp-btn.playing { border-color: var(--green); background: var(--green-lt); color: var(--green); }

.cp-speed { margin-top: 10px; display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--text3); font-weight: 500; }
.speed-btn {
  padding: 3px 9px; border-radius: 6px; border: 1.5px solid var(--border);
  background: var(--bg3); color: var(--text3); font-size: 10px; font-weight: 600; cursor: pointer; transition: all .15s;
}
.speed-btn.active { border-color: var(--ht-blue); color: var(--ht-blue); background: var(--ht-blue-lt); }

.play-progress { margin-top: 9px; background: var(--bg3); border-radius: 3px; height: 3px; overflow: hidden; display: none; }
.play-progress.visible { display: block; }
.pp-bar { height: 100%; background: linear-gradient(90deg, var(--ht-blue), var(--green)); border-radius: 3px; width: 0%; transition: width .3s; }

/* ─── Theme Toggle Button ─── */
.theme-toggle-btn {
  background: none; border: none; cursor: pointer;

function openRobotPanel(){
  const cfg=scenarioConfig[currentScenario].robot;
  document.getElementById('rpName').textContent=cfg.name;
  const av=document.getElementById('rpAvatar');
  av.className='rp-avatar '+cfg.avatarClass;
  av.textContent=cfg.avatarLetter;
  const rows=document.getElementById('rpRows');
  rows.innerHTML=cfg.rows.map(r=>`<div class="rp-row"><span class="rp-label">${r.label}</span><span class="rp-val ${r.cls||''}">${r.val.replace(/\n/g,'<br>')}</span></div>`).join('');
  document.getElementById('robotOverlay').classList.add('open');
}
function closeRobotPanel(e){
  if(e&&e.target!==document.getElementById('robotOverlay'))return;
  document.getElementById('robotOverlay').classList.remove('open');
}

let isLightTheme = true;
function toggleTheme(){
  isLightTheme = !isLightTheme;
  document.querySelector('.phone-shell').classList.toggle('light', isLightTheme);
  document.getElementById('themeIconDark').style.display = isLightTheme ? 'none' : '';
  document.getElementById('themeIconLight').style.display = isLightTheme ? '' : 'none';
}

// ─── Rendering ────────────────────────────────────
const chatBody=document.getElementById('chatBody');

const avLabels={'av-ryan':'R','av-aria':'助','av-aaron':'A','av-daniel':'D','av-victor':'V','av-kevin':'K','av-jason':'J','av-user':'我'};

function makeBubble(msg){
  const isUser=msg.type==='user';
  const row=document.createElement('div');
  row.className='msg-row'+(isUser?' user':'');
  if(!isUser){const av=document.createElement('div');av.className='msg-avatar '+(msg.av||'av-ryan');av.textContent=avLabels[msg.av]||'?';row.appendChild(av);}
  const col=document.createElement('div');col.className='msg-col';
  if(!isUser&&msg.name){const s=document.createElement('div');s.className='msg-sender';s.textContent=msg.name;col.appendChild(s);}
  if(msg.text){const b=document.createElement('div');b.className='bubble '+(isUser?'user-bubble':'bot-bubble');b.innerHTML=msg.text.replace(/\n/g,'<br>');col.appendChild(b);}
  if(msg.card) col.appendChild(makeCard(msg.card));
  if(msg.skill) col.appendChild(makeSkillCard(msg.skill));
  if(msg.flow) col.appendChild(makeFlowCard(msg.flow));
  if(msg.table) col.appendChild(makeTableEl(msg.table));
  if(msg.cron) col.appendChild(makeCronCard(msg.cron));
  if(msg.task) col.appendChild(makeTaskCard(msg.task));
  row.appendChild(col);
  if(isUser){const av=document.createElement('div');av.className='msg-avatar av-user';av.textContent='我';row.appendChild(av);}
  return row;
}
function makeCard(c){
  const el=document.createElement('div');el.className='bubble-card';
  el.innerHTML=`<div class="bc-title">${c.title}</div>`;
  c.rows.forEach(r=>{const d=document.createElement('div');d.className='bc-row';d.innerHTML=`<span class="bc-label">${r.label}</span><span class="bc-val ${r.color||''}">${r.val}</span>`;el.appendChild(d);});
  return el;
}
function makeSkillCard(s){
  const el=document.createElement('div');el.className='skill-card';
  el.innerHTML=`<div class="skill-header"><div class="skill-icon-wrap">⚡</div><div><div class="skill-name">${s.name}</div><div class="skill-ver">${s.ver}</div></div></div><div class="skill-desc">${s.desc}</div><div class="skill-tags">${s.tags.map(t=>`<span class="skill-tag">${t}</span>`).join('')}</div><button class="skill-btn ${s.installed?'installed':''}">${s.installed?'✅ 已安装':'⚡ 立即安装'}</button>`;
  return el;
}
function makeFlowCard(f){
  const el=document.createElement('div');el.className='flow-card';
  el.innerHTML=`<div class="fc-title">${f.title}</div>`;
  f.steps.forEach(s=>{const d=document.createElement('div');d.className='fc-step';d.innerHTML=`<div class="fc-step-icon ${s.status}">${s.icon}</div><span>${s.text}</span>`;el.appendChild(d);});
  return el;
}
function makeTableEl(t){
  const w=document.createElement('div');w.className='table-bubble';
  const tb=document.createElement('table');
  const hr=document.createElement('tr');
  t.headers.forEach(h=>{const th=document.createElement('th');th.textContent=h;hr.appendChild(th);});
  tb.appendChild(hr);
  t.rows.forEach(r=>{const tr=document.createElement('tr');r.slice(0,4).forEach((c,i)=>{const td=document.createElement('td');td.textContent=c;const cls=r[4+i]||'';if(cls)td.className=cls;tr.appendChild(td);});tb.appendChild(tr);});
  w.appendChild(tb);return w;
}
function makeCronCard(c){
  const el=document.createElement('div');el.className='cron-card';
  el.innerHTML=`<div class="cron-title">⏰ ${c.name}</div>`;
  c.rules.forEach(r=>{el.innerHTML+=`<div class="cron-row"><span class="cron-dot"></span>${r}</div>`;});
  return el;
}
function makeTaskCard(t){
  const el=document.createElement('div');el.className='task-card';
  el.innerHTML=`<div class="task-title">📤 ${t.title}</div>`;
  t.agents.forEach(a=>{const d=document.createElement('div');d.className='task-agent';d.innerHTML=`<div class="ta-av" style="background:${a.bg}">${a.emoji}</div><div class="ta-name">${a.name}<div class="ta-task">${a.task}</div></div><div class="ta-status ${a.status}">${a.status==='running'?'执行中…':a.status==='done'?'✅完成':'等待中'}</div>`;el.appendChild(d);});
  return el;
}
function makeTyping(av,name){
  const row=document.createElement('div');row.className='msg-row';row.id='typingRow';
  const a=document.createElement('div');a.className='msg-avatar '+(av||'av-ryan');a.textContent=avLabels[av]||'?';
  const col=document.createElement('div');col.className='msg-col';
  if(name){const s=document.createElement('div');s.className='msg-sender';s.textContent=name;col.appendChild(s);}
  const b=document.createElement('div');b.className='bubble typing-bubble';b.innerHTML='<div class="typing-dots"><span></span><span></span><span></span></div>';
  col.appendChild(b);row.appendChild(a);row.appendChild(col);return row;
}
function appendMsg(msg){
  const t=document.getElementById('typingRow');if(t)t.remove();
  const row=makeBubble(msg);chatBody.appendChild(row);
  setTimeout(()=>row.classList.add('visible'),30);
  chatBody.scrollTop=chatBody.scrollHeight;
}
function showTyping(av,name){
  const t=document.getElementById('typingRow');if(t)t.remove();
  const row=makeTyping(av,name);chatBody.appendChild(row);
  setTimeout(()=>row.classList.add('visible'),30);
  chatBody.scrollTop=chatBody.scrollHeight;
}

// ─── Scenario switching ─────────────
function switchScenario(n,el){
  if(isPlaying)stopPlay();
  currentScenario=n;stepIndex=0;
  document.getElementById('robotOverlay').classList.remove('open');
  document.querySelectorAll('.stab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const cfg=scenarioConfig[n];
  const lbl=document.getElementById('sceneLabel');lbl.textContent=cfg.label;lbl.dataset.s=cfg.ds;
  document.getElementById('chatName').textContent=cfg.chatName;
  document.getElementById('chatStatus').textContent=cfg.chatStatus;
  const av=document.getElementById('chatAvatar');av.className='ch-avatar '+cfg.avatarClass;av.textContent=cfg.avatarLetter;
  document.getElementById('ppBar').style.width='0%';
  document.getElementById('playProgress').classList.remove('visible');
  document.getElementById('playBtn').innerHTML='<span>▶</span><span>一键播放</span>';
  chatBody.innerHTML='<div class="date-divider">今天 '+document.getElementById('clockTime').textContent+'</div>';
}

// ─── Playback ────────────────────────
function togglePlay(){if(isPlaying){stopPlay();return;}startPlay();}
function startPlay(){
  const script=SCRIPTS[currentScenario];if(!script)return;
  isPlaying=true;totalSteps=script.length;
  const btn=document.getElementById('playBtn');btn.classList.add('playing');btn.innerHTML='<span>⏸</span><span>暂停</span>';
  document.getElementById('playProgress').classList.add('visible');
  playNextStep();
}
function playNextStep(){
  if(!isPlaying)return;
  const script=SCRIPTS[currentScenario];
  if(stepIndex>=script.length){stopPlay();return;}
  const msg=script[stepIndex];
  const scaled=(msg.delay||600)/playSpeed;
  if(msg.type!=='user'){
    showTyping(msg.av,msg.name);
    playTimer=setTimeout(()=>{if(!isPlaying)return;appendMsg(msg);updateProgress();stepIndex++;const next=(script[stepIndex]?.delay||600)/playSpeed;playTimer=setTimeout(playNextStep,Math.max(250,next*0.55));},scaled);
  }else{
    playTimer=setTimeout(()=>{if(!isPlaying)return;appendMsg(msg);updateProgress();stepIndex++;const next=(script[stepIndex]?.delay||600)/playSpeed;playTimer=setTimeout(playNextStep,Math.max(180,next*0.35));},Math.max(180,scaled*0.5));
  }
}
function updateProgress(){document.getElementById('ppBar').style.width=(stepIndex/totalSteps*100)+'%';}
function stopPlay(){
  isPlaying=false;clearTimeout(playTimer);
  const btn=document.getElementById('playBtn');btn.classList.remove('playing');
  const done=stepIndex>=(SCRIPTS[currentScenario]?.length||1);
  btn.innerHTML=done?'<span>▶</span><span>一键播放</span>':'<span>▶</span><span>继续播放</span>';
  const t=document.getElementById('typingRow');if(t)t.remove();
}
function resetDemo(){
  stopPlay();stepIndex=0;
  document.getElementById('ppBar').style.width='0%';
  document.getElementById('playProgress').classList.remove('visible');
  document.getElementById('playBtn').innerHTML='<span>▶</span><span>一键播放</span>';
  chatBody.innerHTML='<div class="date-divider">今天 '+document.getElementById('clockTime').textContent+'</div>';
}
function skipToEnd(){
  stopPlay();
  const script=SCRIPTS[currentScenario];
  chatBody.innerHTML='<div class="date-divider">今天 '+document.getElementById('clockTime').textContent+'</div>';
  script.forEach(m=>appendMsg(m));
  stepIndex=script.length;updateProgress();
  document.getElementById('playProgress').classList.add('visible');
  setTimeout(()=>{chatBody.scrollTop=chatBody.scrollHeight;},100);
}
function setSpeed(s,btn){playSpeed=s;document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
function sendUserMsg(){const input=document.getElementById('userInput');const text=input.value.trim();if(!text)return;input.value='';appendMsg({type:'user',text});}
document.getElementById('userInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendUserMsg();}});
</script>
