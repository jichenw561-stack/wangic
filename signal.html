<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 商情中枢 — AI RIS</title>
<style>
:root{--bg:#ffffff;--bg2:#f7f7f8;--bg3:#ebebed;--border:#e4e4e7;--text:#232333;--text2:#6b6b80;--text3:#a1a1aa;--blue:#2952a3;--blue-dim:rgba(41,82,163,0.06);--green:#12b76a;--red:#f04438;--purple:#7b61ff;--accent:#2952a3;--gold:#2952a3;--gold-dim:rgba(41,82,163,0.06);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','SF Pro Display','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:13.5px;-webkit-font-smoothing:antialiased;}
.app{display:grid;grid-template-columns:220px 1fr 340px;height:100vh;}
/* Sidebar */
.sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;}
.sidebar-header{padding:18px 16px;border-bottom:1px solid var(--border);}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{width:30px;height:30px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:white;}
.logo-text{font-size:15px;font-weight:700;color:var(--text);}
.logo-sub{font-size:10px;margin-left:auto;background:var(--blue-dim);color:var(--blue);padding:2px 8px;border-radius:4px;font-weight:600;}
.nav-items{flex:1;padding:8px;overflow-y:auto;}
.nav-group{margin-bottom:16px;}
.nav-group-label{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:1px;padding:6px 10px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2);transition:all .15s ease;}
.nav-item:hover{background:rgba(0,0,0,0.03);color:var(--text);}
.nav-item.active{background:var(--blue-dim);color:var(--blue);font-weight:600;}
.nav-item .ni-icon{width:20px;text-align:center;font-size:14px;}
.nav-item .ni-badge{margin-left:auto;font-size:10px;padding:1px 7px;border-radius:10px;background:var(--blue);color:white;font-weight:600;}
.sidebar-footer{padding:14px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:white;}
.user-name{font-size:12.5px;color:var(--text);font-weight:600;}
.user-role{font-size:10px;color:var(--text3);}
/* Main */
.main{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border);background:var(--bg);}
.main-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.main-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.main-title .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:dotPulse 2s ease-in-out infinite;}
@keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 rgba(11,92,255,0.3);}50%{box-shadow:0 0 0 4px rgba(11,92,255,0.08);}}
.main-title .dot.idle{background:var(--text3);animation:none;}
.main-status{font-size:11px;color:var(--text3);}
.main-actions{display:flex;gap:8px;}
.btn{padding:7px 16px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s ease;border:1px solid var(--border);background:white;color:var(--text2);}
.btn:hover{background:var(--bg2);color:var(--text);}
.btn.gold{border:none;background:var(--blue);color:white;}
.btn.gold:hover{background:#0050e0;}
.btn.purple{border:none;background:var(--purple);color:white;}
.btn.purple:hover{background:#6a4de6;}
.btn.green{border:none;background:var(--green);color:white;}
.btn.green:hover{background:#0fa35e;}
.signal-feed{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;}
/* Signal cards */
.sig-card{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:10px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:all .2s ease;opacity:0;transform:translateY(12px);animation:sigIn .4s ease forwards;}
.sig-card:hover{border-color:rgba(11,92,255,0.25);background:rgba(11,92,255,0.02);}
.sig-card.active{border-color:var(--blue);background:rgba(11,92,255,0.03);}
@keyframes sigIn{to{opacity:1;transform:translateY(0);}}
.sig-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.sig-icon.sentiment{background:rgba(240,68,56,0.08);color:var(--red);}
.sig-icon.venture{background:rgba(123,97,255,0.08);color:var(--purple);}
.sig-icon.research{background:rgba(11,92,255,0.08);color:var(--blue);}
.sig-icon.client{background:rgba(18,183,106,0.08);color:var(--green);}
.sig-body{flex:1;min-width:0;}
.sig-source{font-size:10px;color:var(--text3);font-weight:500;letter-spacing:.3px;margin-bottom:3px;}
.sig-text{font-size:13px;color:var(--text);line-height:1.6;}
.sig-text b{color:var(--blue);font-weight:600;}
.sig-meta{font-size:10px;color:var(--text3);margin-top:4px;display:flex;gap:12px;}
.sig-conf{color:var(--green);font-weight:600;}
.conv-banner{margin:8px 0;padding:12px 16px;border-radius:10px;background:var(--blue-dim);border:1px solid rgba(11,92,255,0.15);display:flex;align-items:center;gap:10px;opacity:0;animation:sigIn .4s ease forwards;cursor:pointer;transition:all .15s;}
.conv-banner:hover{background:rgba(11,92,255,0.1);}
.conv-banner .cb-icon{font-size:18px;}
.conv-banner .cb-text{font-size:13px;color:var(--blue);font-weight:600;flex:1;}
.conv-banner .cb-tag{font-size:10px;padding:2px 8px;border-radius:4px;background:var(--blue);color:white;font-weight:600;}
/* Detail */
.detail{background:var(--bg2);display:flex;flex-direction:column;overflow:hidden;}
.detail-header{padding:14px 16px;border-bottom:1px solid var(--border);}
.detail-header h3{font-size:14px;font-weight:700;margin-bottom:4px;color:var(--text);}
.detail-header .dh-sub{font-size:11px;color:var(--text2);}
.detail-body{flex:1;overflow-y:auto;padding:16px;}
.deal-chain{display:flex;flex-direction:column;gap:0;margin-bottom:16px;}
.deal-node{padding:10px 12px;font-size:12.5px;color:var(--text);line-height:1.6;border-left:2px solid var(--blue);margin-left:8px;position:relative;}
.deal-node::before{content:'';position:absolute;left:-5px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--blue);border:2px solid var(--bg2);}
.deal-node b{color:var(--blue);}
.deal-node .dn-role{font-size:10px;color:var(--blue);font-weight:600;letter-spacing:.5px;margin-bottom:2px;}
.deal-node .dn-text{color:var(--text2);}
.dt-section{font-size:11px;color:var(--text3);font-weight:600;letter-spacing:.5px;margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.dt-section:first-child{margin-top:0;}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);font-size:12px;gap:8px;}
.empty-state .es-icon{font-size:32px;opacity:.5;}
/* Chat for Story 2 */
.chat-area{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px;}
.chat-msg{display:flex;gap:10px;max-width:88%;animation:sigIn .3s ease forwards;opacity:0;}
.chat-msg.user{align-self:flex-end;flex-direction:row-reverse;}
.chat-avatar{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:white;flex-shrink:0;}
.chat-avatar.ai{background:var(--purple);position:relative;}
.chat-avatar.ai::after{content:'AI';position:absolute;bottom:-3px;right:-3px;font-size:6px;background:var(--blue);color:white;padding:0px 2px;border-radius:2px;font-weight:700;}
.chat-avatar.human{background:var(--blue);}
.chat-bubble{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.7;}
.chat-msg.assistant .chat-bubble{background:var(--bg2);border:1px solid var(--border);border-top-left-radius:3px;}
.chat-msg.user .chat-bubble{background:var(--blue);color:white;border-top-right-radius:3px;}
.chat-bubble b{color:var(--blue);font-weight:600;}
.chat-msg.user .chat-bubble b{color:white;}
.chat-system{text-align:center;font-size:11px;color:var(--text3);padding:4px 0;opacity:0;animation:sigIn .3s ease forwards;}
.chat-system-card{margin:4px auto;padding:10px 16px;border-radius:10px;background:var(--blue-dim);border:1px solid rgba(11,92,255,0.15);font-size:12px;color:var(--blue);max-width:420px;text-align:left;line-height:1.6;opacity:0;animation:sigIn .4s ease forwards;cursor:pointer;transition:all .15s;}
.chat-system-card:hover{background:rgba(11,92,255,0.1);}
.chat-system-card b{font-weight:600;}
/* Config panel */
.config-panel{padding:16px;background:var(--bg);border-radius:10px;border:1px solid var(--border);margin-bottom:12px;}
.config-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;color:var(--text2);border-bottom:1px solid var(--border);}
.config-row:last-child{border-bottom:none;}
.config-label{color:var(--text3);width:80px;flex-shrink:0;font-size:11px;}
.config-val{color:var(--text);font-weight:500;}
.config-val b{color:var(--blue);}
/* Twin selector */
.twin-list{padding:8px 20px;border-bottom:1px solid var(--border);display:flex;gap:8px;overflow-x:auto;}
.twin-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg);cursor:pointer;transition:all .15s;white-space:nowrap;font-size:12px;color:var(--text2);}
.twin-chip:hover{border-color:var(--purple);color:var(--text);}
.twin-chip.active{border-color:var(--purple);background:rgba(123,97,255,0.06);color:var(--purple);font-weight:600;}
.twin-chip-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.twin-chip-dot.busy{background:var(--red);}
/* Scrollbar */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#d4d4d8;border-radius:10px;}
@keyframes pulseGold{0%,100%{box-shadow:0 0 0 0 rgba(11,92,255,0.3);}50%{box-shadow:0 0 12px 2px rgba(11,92,255,0.15);}}
.nav-item.pulse{animation:pulseGold 1.5s ease-in-out 3;}
.typing{display:flex;gap:4px;padding:4px 0;align-items:center;}
.typing span{width:4px;height:4px;background:var(--blue);border-radius:50%;animation:blink 1.4s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-4px);opacity:1}}
</style>
<link rel="stylesheet" href="digital-asset.css">
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">RIS</div>
        <span class="logo-text">AI RIS</span>
        <span class="logo-sub">商情中枢</span>
      </div>
    </div>
    <div class="nav-items">
      <div class="nav-group">
        <div class="nav-group-label">信号监控</div>
        <div class="nav-item active" id="navRadar" onclick="switchTab('radar')">
          <span class="ni-icon">⚡</span>我的 Skill
          <span class="ni-badge" id="sigCount">0</span>
        </div>
        <div class="nav-item" id="navAlert" onclick="switchTab('alert')">
          <span class="ni-icon">🔔</span>商情提醒
        </div>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">业务协同</div>
        <div class="nav-item" id="navDeal" onclick="switchTab('deal')">
          <span class="ni-icon">🤝</span>并购撮合
        </div>
        <div class="nav-item" id="navCapital" onclick="switchTab('capital')">
          <span class="ni-icon">🏭</span>产业资本合作
        </div>
        <div class="nav-item" id="navTwin" onclick="switchTab('twin')">
          <span class="ni-icon">👤</span>首席连线
        </div>
        <div class="nav-item" id="navClient" onclick="switchTab('client')">
          <span class="ni-icon">📋</span>客户洞察
        </div>
        <div class="nav-item" id="navRefinance" onclick="switchTab('refinance')">
          <span class="ni-icon">💰</span>再融资协同
        </div>
        <div class="nav-item" id="navDeriv" onclick="switchTab('deriv')">
          <span class="ni-icon">📐</span>衍生品 / 做市
        </div>
        <div class="nav-item" id="navCross" onclick="switchTab('cross')">
          <span class="ni-icon">🌍</span>跨境联动
        </div>
        <div class="nav-item" id="navBranch" onclick="switchTab('branch')">
          <span class="ni-icon">📍</span>属地协同
        </div>
        <div class="nav-item" id="navRoadshow" onclick="switchTab('roadshow')">
          <span class="ni-icon">🎯</span>机构共振
        </div>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">资产管理</div>
        <div class="nav-item" id="navPortfolio" onclick="switchTab('portfolio')">
          <span class="ni-icon">💎</span>被投追踪
        </div>
        <div class="nav-item" id="navExit" onclick="switchTab('exit')">
          <span class="ni-icon">📤</span>退出策略
        </div>
        <div class="nav-item" id="navProduct" onclick="switchTab('product')">
          <span class="ni-icon">🧺</span>主题产品
        </div>
        <div class="nav-item" id="navRisk" onclick="switchTab('risk')">
          <span class="ni-icon">🛡️</span>风险预警
        </div>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">技能沉淀</div>
        <div class="nav-item" id="navSkill" onclick="switchTab('skill')">
          <span class="ni-icon">⚡</span>数字资产
        </div>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">系统</div>
        <div class="nav-item" onclick="window.location.href='overview.html'">
          <span class="ni-icon">←</span>返回总览
        </div>
      </div>
    </div>
    <div class="sidebar-footer" id="sidebarFooter">
      <div class="user-avatar">W</div>
      <div>
        <div class="user-name">王总</div>
        <div class="user-role">投行业务负责人</div>
      </div>
    </div>
  </div>

  <div class="main" id="mainPanel">
    <div class="main-header" id="mainHeader">
      <div class="main-title">
        <span class="dot idle" id="radarDot"></span>
        <span id="mainTitleText">商情雷达</span>
        <span class="main-status" id="mainStatus">待启动</span>
      </div>
      <div class="main-actions" id="mainActions">
        <button class="btn" id="configBtn" onclick="toggleConfig()">⚙ 条件配置</button>
        <button class="btn gold" id="startBtn" onclick="runStory1()">▶ 启动扫描</button>
      </div>
    </div>
    <div class="signal-feed" id="mainContent">
      <div class="empty-state" id="emptyState">
        <div class="es-icon">📡</div>
        <div>点击「启动扫描」观看完整用户故事</div>
        <div style="font-size:11px;color:var(--text3);max-width:300px;text-align:center;line-height:1.6;">投行领导 W 自定义了一套商情碰撞 Skill，系统 7×24 扫描四条线信号，碰撞出撮合机会</div>
      </div>
    </div>
  </div>

  <div class="detail">
    <div class="detail-header">
      <h3 id="detailTitle">详情面板</h3>
      <div class="dh-sub" id="detailSub">选择左侧信号查看详情</div>
    </div>
    <div class="detail-body" id="detailBody">
      <div class="empty-state"><div class="es-icon">📋</div><div>等待信号输入…</div></div>
    </div>
  </div>
</div>

<script>
const mainContent = document.getElementById('mainContent');
const mainPanel = document.getElementById('mainPanel');
const detailBody = document.getElementById('detailBody');
const detailTitle = document.getElementById('detailTitle');
const detailSub = document.getElementById('detailSub');
let running = false;
let currentSkillRole = 'admin';
let currentSkillFocus = 'overview';

const signals = [
  {id:'sig1',icon:'sentiment',emoji:'📡',source:'AI 睿思 · 舆情监测',
   text:'海外 <b>具身智能</b> 赛道突然爆火，头部公司估值 24h 内暴涨 <b>340%</b>，社交媒体讨论量激增 12 倍',
   time:'09:12',conf:'95%',detail:'舆情热度指数从 12 → 847（72倍），Twitter/Reddit 讨论量 24h +1200%。Figure AI 估值 $2.6B→$11.5B。国内搜索指数同步上升。'},
  {id:'sig2',icon:'venture',emoji:'💎',source:'创新投资部 · 被投企业',
   text:'华泰创新 B 轮领投 <b>灵巧机器人</b>（具身智能赛道），当前估值已达投资时 <b>8.6 倍</b>',
   time:'09:15',conf:'内部',detail:'灵巧机器人 2023 年成立，华泰创新 B 轮投 3000 万，现估值 2.58 亿。核心团队来自清华、ETH Zurich。已有 3 家 Pre-IPO 基金接触。'},
  {id:'sig3',icon:'research',emoji:'🔬',source:'华泰行之 · 研究追踪',
   text:'机械首席 <b>陈明</b> 近 6 个月深度覆盖具身智能，与 <b>汇力智造（300XXX）董事长李总</b> 会面 4 次',
   time:'09:18',conf:'行为数据',detail:'陈明近 6 月发布具身智能相关研报 7 篇，路演 12 场。行之 APP 显示与汇力智造李总互动 4 次（2 次正式调研 + 2 次闭门交流），互动频率 Top 3。'},
  {id:'sig4',icon:'client',emoji:'📋',source:'客户动态 · 公开信息',
   text:'汇力智造 <b>李总</b> 近期 3 次公开提及 "<b>布局具身智能</b>"，公司股价异动 +15%',
   time:'09:21',conf:'公开',detail:'2026-03-01 业绩说明会："下半年重点布局具身智能"；2026-03-08 券商策略会：提及已与多家机器人公司接触；2026-03-12 公告披露设立智能制造子公司。'}
];

function switchTab(tab){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  running=false;
  const map={radar:'navRadar',alert:'navAlert',deal:'navDeal',capital:'navCapital',twin:'navTwin',client:'navClient',refinance:'navRefinance',deriv:'navDeriv',cross:'navCross',branch:'navBranch',roadshow:'navRoadshow',portfolio:'navPortfolio',exit:'navExit',product:'navProduct',risk:'navRisk',skill:'navSkill'};
  if(map[tab]) document.getElementById(map[tab]).classList.add('active');
  if(tab==='radar') showRadarView();
  else if(tab==='alert') showAlertView();
  else if(tab==='deal') showDealView();
  else if(tab==='capital') showIndustryCapitalView();
  else if(tab==='twin') showTwinView();
  else if(tab==='client') showClientView();
  else if(tab==='refinance') showRefinanceView();
  else if(tab==='deriv') showDerivativesView();
  else if(tab==='cross') showCrossBorderView();
  else if(tab==='branch') showBranchCoordView();
  else if(tab==='roadshow') showRoadshowView();
  else if(tab==='portfolio') showPortfolioView();
  else if(tab==='exit') showExitView();
  else if(tab==='product') showProductView();
  else if(tab==='risk') showRiskView();
  else if(tab==='skill') showSkillAssetView();
}

// ==================== 我的 Skill ====================
function showRadarView(){
  setUser('W','王总','投行业务负责人');
  setHeader('⚡','我的 Skill','','btn gold','▶ 演示完整流程','runStory1()');
  mainContent.className='signal-feed';
  mainContent.innerHTML='<div class="empty-state"><div class="es-icon">⚡</div><div>点击「演示完整流程」</div><div style="font-size:11px;color:var(--text3);max-width:300px;text-align:center;line-height:1.6;">观看王总如何用自然语言创建一个商情监控 Skill，并看到这个 Skill 7×24 运行后碰撞出的第一个商机</div></div>';
  detailTitle.textContent='我的 Skill';
  detailSub.textContent='当前 0 个活跃 Skill';
  detailBody.innerHTML='<div class="empty-state"><div class="es-icon">💡</div><div>创建你的第一个 Skill…</div></div>';
}

// ==================== 商情提醒（历史记录） ====================
function showAlertView(){
  setUser('W','王总','投行业务负责人');
  setHeader('🔔','商情提醒','','btn','','');

function buildExecutionHtml(exec){
  if(!exec) return '';
  let h='';
  if(exec.ready?.length){
    h+='<div class="dt-section">执行材料</div><div style="font-size:12px;color:var(--text2);line-height:1.7;margin-bottom:10px;">以下材料由对应部门数字人沿用团队作业模板自动生成，可直接外发、排会或进入提案。</div><div class="config-panel">';
    exec.ready.forEach((item,i)=>{h+=`<div class="config-row"><span class="config-label">材料 ${i+1}</span><span class="config-val">${item}</span></div>`;});
    h+='</div>';
  }
  if(exec.dispatch?.length){
    h+='<div class="dt-section">待派发任务</div><div class="deal-chain">';
    exec.dispatch.forEach(item=>{h+=`<div class="deal-node"><div class="dn-role">${item.role}</div><div class="dn-text">${item.text}</div></div>`;});
    h+='</div>';
  }
  if(exec.timeline?.length){
    h+='<div class="dt-section">推进节奏</div><div class="deal-chain">';
    exec.timeline.forEach(item=>{h+=`<div class="deal-node"><div class="dn-role">${item.role}</div><div class="dn-text">${item.text}</div></div>`;});
    h+='</div>';
  }
  if(exec.result){
    h+=`<div class="dt-section">预计转化</div><div style="font-size:12px;color:var(--text2);line-height:1.8;">${exec.result}</div>`;
  }
  return h;
}

function buildAutoScenarioChat(summary){
  if(!summary.exec || !summary.sub) return null;
  const deptLabels = summary.sub.split('/').map(s=>s.trim()).filter(Boolean).slice(0,4);
  if(!deptLabels.length) return null;
  const short = label=>{
    const clean=label.replace(/数字人|团队|业务|负责人/g,'').trim();
    return /[A-Za-z]/.test(clean) ? clean.slice(0,3) : clean.slice(0,2);
  };
  const msgs=[{r:'system',t:'各部门数字人开始并行备料与任务路由'}];
  deptLabels.forEach((dept,idx)=>{
    const texts=[
      `我先接牵头动作，已把执行单、时间表和外发目录拉齐。`,
      `我已沿用团队作业模板归集关键材料，并同步生成内外部版本。`,
      `我会把客户/买方/资金侧需要的外发版本和问答同步准备好。`,
      `我负责把排期、跟进和反馈回流到系统，保持推进节奏一致。`
    ];
    msgs.push({r:'assistant',a:short(dept),t:`<b>${dept}数字人</b>：${texts[idx] || texts[texts.length-1]}`});
  });
  msgs.push({r:'system-card',t:`🚀 <b>数字人协同结果</b><br>${summary.exec.ready?.length || 0} 份关键材料与 ${summary.exec.dispatch?.length || 0} 项任务已同步编排，可直接进入外发、排会和提案。`});
  return {title:'— 数字人并行协同中 —',messages:msgs};
}

function renderScenarioSummary(summary){
  detailTitle.textContent=summary.title;
  detailSub.textContent=summary.sub;
  detailBody.innerHTML=summary.html + buildExecutionHtml(summary.exec);
}

async function runSignalScenario(cards, summary){
  if(running) return;
  running=true;
  mainContent.innerHTML='';
  for(let i=0;i<cards.length;i++){
    await wait(900);
    const s=cards[i];
    const card=document.createElement('div');
    card.className='sig-card';
    card.innerHTML=`<div class="sig-icon ${s.icon}">${s.emoji}</div><div class="sig-body"><div class="sig-source">${s.source}</div><div class="sig-text">${s.text}</div><div class="sig-meta"><span class="sig-conf">置信度 ${s.conf}</span><span style="color:var(--text3)">今日 ${s.time}</span></div></div>`;
    card.onclick=()=>{
      document.querySelectorAll('.sig-card').forEach(c=>c.classList.remove('active'));
      card.classList.add('active');
      detailTitle.textContent=s.panelTitle || s.source;
      detailSub.textContent=s.panelSub || ('今日 '+s.time+' · 置信度 '+s.conf);
      detailBody.innerHTML=s.panelHtml || `<div class="dt-section">信号详情</div><div style="font-size:12.5px;color:var(--text2);line-height:1.8;">${s.detail || ''}</div>`;
    };
    mainContent.appendChild(card);
    mainContent.scrollTop=mainContent.scrollHeight;
    if(i===0) card.onclick();
  }
  const autoChat = summary.chat?.length ? {title:summary.chatTitle || '— 数字人协同处理中 —',messages:summary.chat} : buildAutoScenarioChat(summary);
  if(autoChat?.messages?.length){
    await wait(700);
    const divider=document.createElement('div');
    divider.className='chat-system';
    divider.textContent=autoChat.title;
    mainContent.appendChild(divider);
    mainContent.scrollTop=mainContent.scrollHeight;
    await playChat(autoChat.messages, mainContent);
  }
  await wait(900);
  const conv=document.createElement('div');
  conv.className='conv-banner';
  conv.innerHTML=`<span class="cb-icon">${summary.icon || '⚡'}</span><span class="cb-text">${summary.text}</span><span class="cb-tag">${summary.tag || '高优先级'}</span>`;
  conv.onclick=()=>renderScenarioSummary(summary);
  mainContent.appendChild(conv);
  mainContent.scrollTop=mainContent.scrollHeight;
  if(summary.exec){
    await wait(700);
    const action=document.createElement('div');
    action.className='conv-banner';
    action.innerHTML=`<span class="cb-icon">🚀</span><span class="cb-text">${summary.exec.banner || `数字员工已生成执行单 · 待派发 ${summary.exec.dispatch?.length || 0} 项任务`}</span><span class="cb-tag">立即推进</span>`;
    action.onclick=()=>renderScenarioSummary(summary);
    mainContent.appendChild(action);
    mainContent.scrollTop=mainContent.scrollHeight;
  }
  renderScenarioSummary(summary);
  running=false;
}

// ==================== 通用工具 ====================
function setUser(char,name,role){
  document.getElementById('sidebarFooter').innerHTML=`<div class="user-avatar">${char}</div><div><div class="user-name">${name}</div><div class="user-role">${role}</div></div>`;
}
function setHeader(icon,title,statusText,btnClass,btnText,btnAction){
  document.getElementById('mainHeader').innerHTML=`<div class="main-title"><span style="font-size:14px;">${icon}</span><span>${title}</span></div><div class="main-actions"><button class="${btnClass}" onclick="${btnAction}">${btnText}</button></div>`;
}
async function playChat(chat, container){
  for(let i=0;i<chat.length;i++){
    const m=chat[i]; await wait(i===0?400:1200);
    if(m.r==='system'){const d=document.createElement('div');d.className='chat-system';d.textContent=m.t;container.appendChild(d);}
    else if(m.r==='system-card'){const d=document.createElement('div');d.className='chat-system-card';d.innerHTML=m.t;container.appendChild(d);}
    else{
      if(m.r==='assistant'){const typ=document.createElement('div');typ.className='chat-msg assistant';typ.style.opacity='1';typ.innerHTML=`<div class="chat-avatar ai">${m.a}</div><div class="chat-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;container.appendChild(typ);container.scrollTop=container.scrollHeight;await wait(1500);typ.remove();}
      const d=document.createElement('div');d.className='chat-msg '+m.r;
      const cls=m.r==='user'?'human':'ai';
      d.innerHTML=`<div class="chat-avatar ${cls}">${m.a}</div><div class="chat-bubble">${m.t}</div>`;
      container.appendChild(d);
    }
    container.scrollTop=container.scrollHeight;
  }
}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
